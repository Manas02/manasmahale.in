        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

        :root {
            --bg: #F5F4EF;
            --ink: #111111;
            --subtle: #888888;
            --accent: #D93025;
        }

        ::selection { background: var(--accent); color: var(--bg); }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: default; }

        body {
            background-color: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            width: 100vw;
            font-family: 'Instrument Serif', serif;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            position: relative;
        }

        /* --- Header & Nav --- */
        .identity { position: absolute; top: 4rem; left: 4rem; z-index: 10; }
        .identity h1 { 
            font-size: 4rem; 
            font-weight: 400; 
            letter-spacing: -0.02em; 
            margin-bottom: 0;
            line-height: 1;
        }

        nav {
            position: absolute; top: 4rem; right: 4rem; 
            display: flex; flex-direction: column; align-items: flex-end; 
            gap: 0.5rem; z-index: 10;
        }

        .nav-link {
            text-decoration: none; color: var(--subtle); font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .nav-link:hover { color: var(--accent); font-style: italic; transform: translateX(-5px); }

        /* --- Main Content --- */
        main { 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            z-index: 1; 
        }

        .text-block {
            font-size: clamp(2.5rem, 4.5vw, 5rem);
            line-height: 1.4;
            font-weight: 400;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .no-break { white-space: nowrap; }
        .math-italic { font-family: 'Times New Roman', serif; font-style: italic; margin-right: 2px;}

        /* --- Layering Logic --- */
        .front-text { position: relative; z-index: 10; pointer-events: auto; }

        .molecule-inline {
            display: inline-block;
            width: 180px; 
            height: 140px; 
            vertical-align: middle; 
            position: relative;
            z-index: 0; 
            margin: 0 -25px; /* Desktop overlap */
            transform: translateY(-5px); 
            background: transparent;
        }
        
        .molecule-inline canvas { outline: none !important; }

        .activity-wrapper {
            display: inline-block;
            min-width: 380px; 
            color: var(--accent);
            font-style: italic;
            position: relative; 
            z-index: 10; 
        }

        .activity-text {
            display: inline-block;
            transition: opacity 0.6s ease, transform 0.6s ease;
            opacity: 1;
            transform: translateY(0);
        }
        .activity-text.hidden { opacity: 0; transform: translateY(10px); }

        /* --- Highlight Animation (Block Style) --- */
        .highlight-link {
            color: var(--accent); 
            text-decoration: none; 
            font-style: italic;
            padding: 0 4px;     
            margin: 0 -4px;     
            border-radius: 4px; 
            transition: background-color 0.2s ease, color 0.2s ease;
            position: relative; 
            z-index: 10;
        }

        .highlight-link:hover { 
            background-color: var(--accent); 
            color: var(--bg); 
        }

        .fade-in { animation: fadeIn 1.5s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 900px) {
            body { 
                padding: 2rem; 
                justify-content: flex-start; 
                height: auto; 
                min-height: 100vh;
                overflow-x: hidden; 
            }
            
            .identity { position: relative; margin-bottom: 2rem; top: 0; left: 0; }
            .identity h1 { font-size: 3rem; white-space: nowrap; } 

            nav { 
                position: relative; top: 0; right: 0; 
                flex-direction: row; 
                flex-wrap: wrap; 
                gap: 1.5rem; 
                margin-bottom: 4rem; 
                align-items: center;
            }

            .text-block { font-size: 2rem; line-height: 1.3; }

            .molecule-inline { 
                width: 90px;  
                height: 70px; 
                margin: 0 -8px; 
                transform: translateY(2px); 
            } 
            
            .activity-wrapper { 
                display: block; 
                min-width: 0; 
                margin-top: 0.25rem; 
            }
        }


        .footer-container {
        position: fixed;       /* Sticks to the viewport bottom */
        bottom: 0;
        left: 0;
        width: 100vw;          /* Forces full screen width */
        z-index: -1;           /* Places it behind your text */
        pointer-events: none;  /* Allows clicking text displayed over the image */
        line-height: 0;        /* Removes any default gap at the bottom */
        }

        .footer-art {
        width: 100%;           /* Spans the full container width */
        height: auto;
        max-height: 45vh;      /* Limits height to 45% of screen so it doesn't takeover */
        
        object-fit: cover;     /* Crops the image smartly instead of squishing it */
        object-position: center center; /* Keeps the bottom of the painting visible */

        /* The Gradient Mask: Transparent at top -> Solid at bottom */
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 90%);
        mask-image: linear-gradient(to bottom, transparent 0%, black 90%);
        
        opacity: 0.85;         /* Optional: adjust for desired subtlety */
        }

        /* --- Add this at the end of your CSS --- */

        max-height: 60vh;      /* Takes up 60% of the screen height on phone */
        opacity: 1;            /* Full visibility */
        object-position: center; /* Centers the art better on narrow screens */
        
        /* Adjust gradient to show more art before fading */

        mask-image: linear-gradient(to bottom, transparent 0%, black 60%);
        }

    <script>
        // Use PubChem CIDs again to ensure immediate loading without local files
        const sequence = [
            { 
                text: "pharmacokinetics", 
                cid: 65536,
                scale: 0.22 
            }, 
            { 
                text: "pharmacodynamics", 
                cid: 155903259,
                scale: 0.22 
            }, 
            { 
                text: "toxicity", 
                cid: 2662, 
                scale: 0.20 
            }, 
            { 
                text: "biological activity", 
                cid: 5904, 
                scale: 0.20 
            } 
        ];

        let viewer = null;
        let currentIndex = 0;
        const activityText = document.getElementById('activity-text');

        $(document).ready(function() {
            viewer = $3Dmol.createViewer("mol-viewer", {
                backgroundColor: "#F5F4EF", 
                transparent: true
            });

            loadStep(0);

            setInterval(() => {
                currentIndex = (currentIndex + 1) % sequence.length;
                loadStep(currentIndex);
            }, 4500); 
        });

        function loadStep(index) {
            const data = sequence[index];
            activityText.classList.add('hidden');

            const sdfUrl = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${data.cid}/record/SDF/?record_type=3d`;

            $.ajax(sdfUrl, { 
                success: function(sdfData) {
                    viewer.clear();
                    viewer.addModel(sdfData, "sdf");
                    
                    // High contrast "Ink" style
                    viewer.setStyle({}, { 
                        stick: { radius: data.scale, color: "#111111" } 
                    });
                    
                    viewer.zoomTo();
                    viewer.render();
                    viewer.spin('y', 0.6); 

                    setTimeout(() => {
                        activityText.textContent = data.text;
                        activityText.classList.remove('hidden');
                    }, 400); 
                },
                error: function(err) { 
                    console.error("API Load Failed", err); 
                }
            });
        }
    </script>
