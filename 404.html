<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

        :root {
            --bg: #F5F4EF;
            --ink: #111111;
            --subtle: #888888;
            --accent: #D93025;
        }

        ::selection { background: var(--accent); color: var(--bg); }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: default; }

        body {
            background-color: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            width: 100vw;
            font-family: 'Instrument Serif', serif;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            position: relative;
        }

        /* --- Header & Nav --- */
        .identity { position: absolute; top: 4rem; left: 4rem; z-index: 10; }
        .identity h1 { 
            font-size: 4rem; 
            font-weight: 400; 
            letter-spacing: -0.02em; 
            margin-bottom: 0;
            line-height: 1;
        }
        .identity a { text-decoration: none; color: inherit; cursor: pointer; }

        nav {
            position: absolute; top: 4rem; right: 4rem; 
            display: flex; flex-direction: column; align-items: flex-end; 
            gap: 0.5rem; z-index: 10;
        }

        .nav-link {
            text-decoration: none; color: var(--subtle); font-size: 1.1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .nav-link:hover { color: var(--accent); font-style: italic; transform: translateX(-5px); }

        /* --- Main Content --- */
        main { 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            z-index: 1; 
        }

        .text-block {
            font-size: clamp(2.5rem, 4.5vw, 5rem);
            line-height: 1.4;
            font-weight: 400;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .no-break { white-space: nowrap; }
        .math-italic { font-family: 'Times New Roman', serif; font-style: italic; margin-right: 2px;}

        /* --- Molecule Styling --- */
        .front-text { position: relative; z-index: 10; pointer-events: auto; }

        .molecule-inline {
            display: inline-block;
            width: 180px; 
            height: 140px; 
            vertical-align: middle; 
            position: relative;
            z-index: 0; 
            margin: 0 -25px; 
            transform: translateY(-5px); 
            background: transparent;
        }
        
        .molecule-inline canvas { outline: none !important; }

        .error-code {
            color: var(--accent);
            font-style: italic;
        }

        /* --- Button/Link Style --- */
        .highlight-link {
            color: var(--accent); 
            text-decoration: none; 
            font-style: italic;
            padding: 0 4px;     
            margin: 0 -4px;     
            border-radius: 4px; 
            transition: background-color 0.2s ease, color 0.2s ease;
            position: relative; 
            z-index: 10;
            cursor: pointer;
        }

        .highlight-link:hover { 
            background-color: var(--accent); 
            color: var(--bg); 
        }

        .fade-in { animation: fadeIn 1.5s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* --- Footer --- */
        .footer-container {
            position: fixed; bottom: 0; left: 0; width: 100vw; z-index: -1;
            pointer-events: none; line-height: 0;
        }

        .footer-art {
            width: 100%; height: auto; max-height: 45vh;
            object-fit: cover; object-position: center center;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 90%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 90%);
            opacity: 0.85;
        }

        /* --- MOBILE --- */
        @media (max-width: 900px) {
            body { padding: 2rem; justify-content: flex-start; height: auto; min-height: 100vh; overflow-x: hidden; }
            .identity { position: relative; margin-bottom: 2rem; top: 0; left: 0; }
            .identity h1 { font-size: 3rem; white-space: nowrap; } 
            nav { position: relative; top: 0; right: 0; flex-direction: row; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 4rem; align-items: center; }
            .text-block { font-size: 2rem; line-height: 1.3; }
            .molecule-inline { width: 90px; height: 70px; margin: 0 -8px; transform: translateY(2px); } 
            .footer-art { max-height: 60vh; opacity: 1; -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 60%); mask-image: linear-gradient(to bottom, transparent 0%, black 60%); }
        }
    </style>
</head>
<body>

    <header class="identity fade-in">
        <h1><a href="https://manasmahale.in">MANAS MAHALE</a></h1>
    </header>

    <nav class="fade-in">
        <a href="./blog.html" class="nav-link">Blog</a>
        <a href="./marginalia.html" class="nav-link">Marginalia</a>
        <a href="./contact.html" class="nav-link">Contact</a>
        <a href="./cv.pdf" class="nav-link">CV</a>
    </nav>

    <main class="fade-in">
        <div class="text-block">
            <span class="no-break">
                <span class="front-text math-italic">f</span><span class="front-text">(</span>
                <div id="mol-viewer" class="molecule-inline"></div>
                <span class="front-text">)</span>
                &equals;
            </span>
            <span class="math-italic">undefined</span>
            <br>
            This page does not exist.
            <br>
            <a href="https://manasmahale.in" class="highlight-link">Return to home.</a>
        </div>
    </main>

    <script>
        // Loading Methane (Simple hydrocarbon) to represent a "basic" or "null" state
        const moleculeCID = 297; 
        let viewer = null;

        $(document).ready(function() {
            viewer = $3Dmol.createViewer("mol-viewer", {
                backgroundColor: "#F5F4EF", 
                transparent: true
            });

            const sdfUrl = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${moleculeCID}/record/SDF/?record_type=3d`;

            $.ajax(sdfUrl, { 
                success: function(sdfData) {
                    viewer.clear();
                    viewer.addModel(sdfData, "sdf");
                    
                    // High contrast "Ink" style
                    viewer.setStyle({}, { 
                        stick: { radius: 0.22, color: "#111111" } 
                    });
                    
                    viewer.zoomTo();
                    viewer.render();
                    
                    // Slightly faster spin for the error state
                    viewer.spin('y', 0.8); 
                },
                error: function(err) { 
                    console.error("Molecule Load Failed", err); 
                }
            });
        });
    </script>

    <footer class="footer-container fade-in">
        <img 
            src="./assets/404.jpg"
            alt="Lisbon" 
            class="footer-art"
        >
    </footer>
</body>
</html>
