<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWIC - Structural Red Style</title>
    <style>
        /* Import the font used in the design */
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

        /* Define colors */
        :root {
            --bg: #f5f4f0; /* Cream background */
            --ink: #111111; /* Black text */
            --accent: #D93025; /* Deep Red accent */
        }

        /* Basic page setup to center the banner */
        body {
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Instrument Serif', serif;
        }

        /* Main Banner Container */
        .banner-container {
            width: 1100px;
            /* Max width for smaller screens */
            max-width: 95vw; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px; /* Padding around the whole element */
            box-sizing: border-box;
            background-color: var(--bg);
            color: var(--ink);
        }

        /* --- Red Rule Lines --- */
        .rule-group { width: 100%; }
        
        .b3-rule-thick { 
            height: 4px; 
            background: var(--accent); 
            width: 100%;
        }

        .b3-rule-thin {
            height: 1px;
            background: var(--accent);
            width: 100%;
        }

        /* Spacing specifically for the top set of rules */
        .top-rules .b3-rule-thick { margin-bottom: 5px; }

        /* Spacing specifically for the bottom set of rules */
        .bottom-rules .b3-rule-thin { margin-bottom: 5px; }
        .bottom-rules .b3-rule-thick { margin-bottom: 0; }


        /* --- Text Content Area --- */
        .b3-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0; /* Space between lines and text */
        }

        /* The side numbers (N° 001 / MMXXVI) */
        .b3-roman {
            font-size: 24px;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: bold;
        }

        /* The central title group */
        .b3-title-group {
            text-align: center;
        }

        /* "This Week In" */
        .b3-pre {
            color: var(--accent);
            font-style: italic;
            font-size: 42px;
            display: block;
            margin-bottom: -10px; /* Tighten spacing to main title */
        }

        /* "CHEMINFORMATICS" */
        .b3-main {
            font-size: 88px;
            text-transform: uppercase;
            letter-spacing: 0px;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="banner-container">

        <div class="rule-group top-rules">
            <div class="b3-rule-thick"></div>
            <div class="b3-rule-thin"></div>
        </div>

        <div class="b3-content">
            <span class="b3-roman">N° 010</span>

            <div class="b3-title-group">
                <span class="b3-pre">This Week In</span>
                <span class="b3-main">Cheminformatics</span>
            </div>

            <span class="b3-roman">MMXXVI</span>
        </div>

        <div class="rule-group bottom-rules">
            <div class="b3-rule-thin"></div>
            <div class="b3-rule-thick"></div>
        </div>

    </div>
    </body>
</html>
