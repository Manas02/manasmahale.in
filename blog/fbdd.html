            color: var(--ink);

            width: 100%;

<body>
    <nav>

    <header>
        <h1>FragmentBERT</h1>
    </header>

    <main>
        <div id="pdf-slides" aria-label="FragmentBERT slides"></div>
        <div id="pdf-status" class="visually-hidden" aria-live="polite"></div>
    </main>

    <script>
      const PDF_URL = 'https://manasmahale.in/assets/fbdd.pdf';

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const slidesContainer = document.getElementById('pdf-slides');
        const statusElement = document.getElementById('pdf-status');

        let pdfDocument = null;
        let renderToken = 0;

        async function renderPDF() {
            const currentToken = ++renderToken;
            slidesContainer.innerHTML = '';

            try {
                if (!pdfDocument) {
                    pdfDocument = await pdfjsLib.getDocument(PDF_URL).promise;
                }

                const containerWidth = slidesContainer.clientWidth;
                const devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

                for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
                    if (currentToken !== renderToken) return;

                    const page = await pdfDocument.getPage(pageNumber);

                    const baseViewport = page.getViewport({ scale: 1 });
                    const cssScale = containerWidth / baseViewport.width;
                    const renderScale = cssScale * devicePixelRatio;
                    const viewport = page.getViewport({ scale: renderScale });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d', { alpha: false });

                    canvas.className = 'slide';
                    canvas.width = Math.floor(viewport.width);
                    canvas.height = Math.floor(viewport.height);

                    canvas.style.width = `${Math.floor(baseViewport.width * cssScale)}px`;
                    canvas.style.height = `${Math.floor(baseViewport.height * cssScale)}px`;

                    canvas.setAttribute('aria-label', `Slide ${pageNumber}`);

                    slidesContainer.appendChild(canvas);

                    await page.render({
                        canvasContext: context,
                        viewport
                    }).promise;
                }

                statusElement.textContent = '';
            } catch (error) {
                console.error('Could not render PDF:', error);
                statusElement.textContent = 'Could not render PDF.';
            }
        }

        function debounce(fn, delay = 200) {
            let timeout;
            return function () {
                clearTimeout(timeout);
                timeout = setTimeout(fn, delay);
            };
        }

        window.addEventListener('resize', debounce(renderPDF));
        renderPDF();
    </script>
